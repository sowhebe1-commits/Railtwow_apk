name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release with direct APK download'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup environment config
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK with clean naming
        id: apk-prep
        run: |
          mkdir -p release_apk
          ORIG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$ORIG_APK" ]; then
            cp "$ORIG_APK" release_apk/RailOne-debug.apk
            echo "Found APK at $ORIG_APK -> copied to release_apk/RailOne-debug.apk"
          else
            echo "ERROR: APK file not found in app/build/outputs/apk/debug"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailOne-debug-apk
          path: release_apk/RailOne-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (Direct Download)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('RailOne Build #{0}', github.run_number) }}
          body: |
            ### 🚆 RailOne Android App - Ready for Download
            
            - **Commit**: `${{ github.sha }}`
            - **Branch/Ref**: `${{ github.ref_name }}`
            - **Build**: #${{ github.run_number }}
            
            #### 📥 Direct Download:
            Download the `RailOne-debug.apk` file below directly onto your Android device to install and test.
          files: |
            release_apk/RailOne-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
